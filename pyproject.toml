[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simuguard"
version = "0.1.0.dev0"
description = "Detect, verify and analyze contact artifacts in simulation-based robot policy evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
robotwin = ["sapien==3.0.0b1"]

[tool.setuptools.packages.find]
include = ["simuguard*"]
